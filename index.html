async function midiInputs(){const d=$('device'),old=d.value||preferredDevice;d.innerHTML='<option value="">すべてのMIDI入力</option>';let count=0,failed=[];for(const inp of midiAccess.inputs.values()){if(inp.state==='disconnected')continue;const o=document.createElement('option');o.value=inp.id;o.textContent=inp.name||inp.id;d.append(o);inp.onmidimessage=e=>{if(d.value&&d.value!==inp.id)return;const [st,p,v]=e.data,k=inp.id+':'+(st&15)+':'+p;if((st&240)===144&&v){msg('MIDI受信：'+(inp.name||inp.id)+' / ノート '+p+' / 強さ '+v);try{liveOn(p,v,k,e.timeStamp)}catch(err){msg('MIDI受信済み・音源エラー：'+err.message)}}else if((st&240)===128||((st&240)===144&&!v))keyOff(k,e.timeStamp);else if((st&240)===176&&p===64)pedalChange(inp.id+':'+(st&15),v,e.timeStamp)};try{await inp.open();count++}catch(e){failed.push((inp.name||inp.id)+': '+e.message)}}d.value=[...d.options].some(o=>o.value===old)?old:'';msg(count?'MIDI入力 '+count+' 台接続：鍵盤を弾いてください':failed.length?'MIDIを開けません：'+failed.join(' / '):'MIDI機器が見つかりません。USB接続とWindowsの認識を確認し、再接続してください。');}
$('midi').onclick=async()=>{const btn=$('midi');btn.disabled=true;msg('MIDI接続を確認中… 権限の確認が出たら許可してください。');try{if(!window.isSecureContext&&!navigator.requestMIDIAccess)throw Error('安全なコンテキストではありません。Chromeでダウンロード済みHTMLを直接開いてください');if(!navigator.requestMIDIAccess)throw Error('Web MIDI非対応です。ChromeまたはEdgeを使用してください');try{setupAudio()}catch(e){msg('音源初期化エラー：'+e.message+' / MIDI接続を続行します')}midiAccess=await navigator.requestMIDIAccess({sysex:false});midiAccess.onstatechange=()=>{void midiInputs()};await midiInputs()}catch(e){msg('MIDI接続エラー（'+e.name+'）：'+e.message+'。Chromeの設定 → プライバシーとセキュリティ → サイトの設定 → MIDI機器の権限を確認してください。')}finally{btn.disabled=false}};
// 0とSpaceは入力欄を含む全操作領域で最優先に処理する。
window.addEventListener('keydown',e=>{if($('instrumentDialog').open||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;const zero=e.code==='Digit0'||e.code==='Numpad0'||e.key==='0',space=e.code==='Space'||e.key===' ';if(!zero&&!space)return;e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;if(document.activeElement instanceof HTMLElement)document.activeElement.blur();if(zero)$('rew').click();else if(playing)stop();else start();},true);
window.addEventListener('keydown',e=>{if($('instrumentDialog').open||e.isComposing)return;if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;const k=e.key.toLowerCase();if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.code==='Space'||['r','0','s','c'].includes(k))){e.preventDefault();if(e.repeat)return;if(e.code==='Space')$('play').click();else $(({r:'record','0':'rew',s:'splitclip',c:'mergeclip'})[k]).click();return}if(e.repeat)return;if(e.key==='Delete'&&!chosen&&picks.size){$('deleteclip').click()}else if(e.key==='Delete'&&chosen){checkpoint();tracks[selected].notes=tracks[selected].notes.filter(n=>n!==chosen);chosen=null;draw()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('undo').click()}});window.addEventListener('keydown',e=>{if($('instrumentDialog').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&picks.size){e.preventDefault();$('copyclip').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&clipboard.length){e.preventDefault();$('pasteclip').click()}});window.addEventListener('blur',()=>{for(const id of [...active.keys()])liveOff(id)});
// プロジェクト保存と読み込み
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('save').onclick=async()=>{try{const used=new Set(tracks.flatMap(t=>clips(t).flatMap(c=>audioParts(c).map(p=>p.asset))));const audio=[];for(const id of used){const a=assets.get(id);const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(new Blob([a.bytes]))});audio.push({id,name:a.name,data})}download(JSON.stringify({version:3,bpm,bars,loopBars,tracks,audio}), 'DAWtaro.json','application/json');msg('プロジェクトを保存しました')}catch(e){msg('保存失敗：'+e.message)}};$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const x=JSON.parse(await f.text());if(!Array.isArray(x.tracks)||(x.tracks.length<1||x.tracks.length>16)||!Number.isFinite(x.bpm)||!Number.isFinite(x.bars))throw Error('形式が違います');const loaded=[];for(const a of x.audio||[]){const raw=atob(a.data.split(",")[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));loaded.push(await decodeAsset(new File([bytes],a.name),a.id))}const nb=Math.max(1,Math.round(x.bars));const clean=x.tracks.map((t,i)=>({name:String(t.name||'Track '+(i+1)),inst:clamp(Math.round(+t.inst||0),0,135),vol:clamp(Number.isFinite(t.vol)?t.vol:80,0,100),pan:clamp(+t.pan||0,-100,100),mute:!!t.mute,solo:!!t.solo,notes:(Array.isArray(t.notes)?t.notes:[]).filter(n=>[n.p,n.s,n.d,n.v].every(Number.isFinite)&&n.s>=0&&n.s<nb*4&&n.d>0).map(n=>({p:clamp(Math.round(n.p),0,127),s:n.s,d:Math.min(n.d,nb*4-n.s),v:clamp(Math.round(n.v),1,127)}))}));for(let i=0;i<clean.length;i++){const raw=x.tracks[i],t=clean[i];if(raw.kind==="audio")t.kind="audio";if(Array.isArray(raw.clips)){t.clips=raw.clips.filter(c=>typeof c.id==='string'&&Number.isFinite(c.s)&&Number.isFinite(c.d)&&c.s>=0&&c.d>0&&c.s+c.d<=nb*4).map(c=>({...c}));const valid=(raw.notes||[]).filter(n=>[n.p,n.s,n.d,n.v].every(Number.isFinite)&&n.s>=0&&n.s<nb*4&&n.d>0);t.notes.forEach((n,j)=>n.cid=valid[j].cid)}}stop(true);for(const a of loaded)assets.set(a.id,a);tracks=clean;picks.clear();selected=0;bpm=clamp(x.bpm,30,300);bars=nb;loopBars=clamp(Math.round(x.loopBars||16),1,128);$('bpm').value=bpm;$('bars').value=loopBars;history=[];chosen=null;renderTracks();draw();msg('プロジェクトを読み込みました')}catch(e){msg('読み込み失敗：'+e.message)}$('file').value=''};
// 標準MIDIファイル（形式1、480 PPQ）
const be=(n,k)=>Array.from({length:k},(_,i)=>(n>>>(8*(k-i-1)))&255), vl=n=>{const a=[n&127];while(n>>=7)a.unshift((n&127)|128);return a}, chunk=(s,a)=>[...s.split('').map(c=>c.charCodeAt(0)),...be(a.length,4),...a];$('export').onclick=()=>{const midiTracks=tracks.filter(t=>!audioTrack(t)),tempo=Math.round(60000000/bpm),out=chunk('MThd',[0,1,0,midiTracks.length+1,1,224]);out.push(...chunk('MTrk',[0,255,81,3,...be(tempo,3),0,255,88,4,4,2,24,8,0,255,47,0]));midiTracks.forEach((tr,i)=>{const ch=drumOf(tr.inst)?9:(i<9?i:(i+1)%16),ev=[[0,0,[0xc0|ch,(drumOf(tr.inst)?0:programOf(tr.inst))]],[0,0,[0xb0|ch,7,Math.round(tr.vol*1.27)]]];tr.notes.forEach(n=>{const s=Math.round(n.s*480),end=Math.max(s+1,Math.round((n.s+n.d)*480));ev.push([s,2,[0x90|ch,n.p,n.v]],[end,1,[0x80|ch,n.p,0]])});ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let prev=0,a=[];for(const [t,_,bytes] of ev){a.push(...vl(t-prev),...bytes);prev=t}a.push(0,255,47,0);out.push(...chunk('MTrk',a))});download(new Uint8Array(out),'SimpleDAW.mid','audio/midi')};
// WAV書き出し（合成音源をオフラインでレンダリング）
$('wav').onclick=async()=>{const b=$('wav');b.disabled=true;try{const duration=Math.max(1,...tracks.flatMap(t=>[...t.notes.map(n=>(n.s+n.d)*sec()),...clips(t).map(c=>(c.s+c.d)*sec())]))+(sf?Math.max(.7,...tracks.flatMap(t=>(sf.presets.get(programOf(t.inst))?.layers||[]).map(L=>Math.min(20,Math.pow(2,((L.b[38]??-12000)+(L.a[38]??0))/1200))+.1))):.7);if(duration>900)throw Error('15分以下にしてください');const ac=new OfflineAudioContext(2,Math.ceil(duration*44100),44100),out=ac.createGain();outputSettings(ac,out);prepareAudio(ac);const solo=tracks.some(t=>t.solo);for(const t of tracks)if(!t.mute&&(!solo||t.solo)){for(const n of t.notes)tone(ac,out,t.inst,n.p,n.v,n.s*sec(),n.d*sec(),t.vol,t.pan);if(audioTrack(t))for(const c of clips(t))for(const p of audioParts(c))audioVoice(ac,out,t,p,(c.s+p.at)*sec(),0,p.len)}msg('WAVを生成中…');const a=await ac.startRendering(),buf=new ArrayBuffer(44+a.length*4),v=new DataView(buf);function str(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}str(0,'RIFF');v.setUint32(4,buf.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,44100,true);v.setUint32(28,176400,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,a.length*4,true);const l=a.getChannelData(0),r=a.getChannelData(1);for(let i=0;i<a.length;i++){v.setInt16(44+i*4,clamp(l[i],-1,1)*32767,true);v.setInt16(46+i*4,clamp(r[i],-1,1)*32767,true)}download(buf,'DAWtaro.wav','audio/wav');msg('WAVを書き出しました')}catch(e){msg('WAVエラー：'+e.message)}finally{b.disabled=false}};
$('addtrack').onclick=()=>{if(tracks.length>=16){msg('最大16トラックです');return}stop();checkpoint();tracks.push({name:'Track '+(tracks.length+1),inst:0,vol:80,pan:0,mute:false,solo:false,notes:[]});selected=tracks.length-1;chosen=null;renderTracks();draw();$('arrscroll').scrollTop=Math.max(0,25+tracks.length*39-$('arrscroll').clientHeight)};
$('deltrack').onclick=()=>{if(tracks.length<=1){msg('最低1トラック必要です');return}if(!confirm('選択中のトラックを削除しますか？'))return;stop();checkpoint();tracks.splice(selected,1);selected=Math.min(selected,tracks.length-1);chosen=null;renderTracks();draw()};
$('arrscroll').addEventListener('scroll',()=>{$('tracks').scrollTop=$('arrscroll').scrollTop;draw()});$('rollscroll').addEventListener('scroll',draw);window.addEventListener('resize',draw);
renderTracks();setScoreView(staffMode);buttons();

// 音源本体は容量制限の小さいlocalStorageではなくIndexedDBに保存する。
function sfStore(mode,file){return new Promise((resolve,reject)=>{const req=indexedDB.open('DAWtaro-audio-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('soundfonts');req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('データベースが使用中です'));req.onsuccess=()=>{const db=req.result;try{const tx=db.transaction('soundfonts',mode==='put'?'readwrite':'readonly'),store=tx.objectStore('soundfonts');const op=mode==='put'?store.put({name:file.name,blob:file},'current'):store.get('current');tx.oncomplete=()=>{db.close();resolve(op.result)};tx.onabort=tx.onerror=()=>{db.close();reject(tx.error||op.error||Error('保存エラー'))}}catch(e){db.close();reject(e)}}})}
// 操作設定のみを保存し、楽曲のデータは従来どおりプロジェクト保存で管理する。
$('metrolevel').oninput=()=>{$('metrovalue').textContent=$('metrolevel').value+'%'};
const prefKey='DAWtaro-settings-v1',prefInputs=['bpm','masterlevel','sfboost','metrolevel','bars','zoom','snap','length','velocity'];let preferredDevice='';
function savePreferences(){try{localStorage.setItem(prefKey,JSON.stringify({inputs:Object.fromEntries(prefInputs.map(id=>[id,$(id).value])),metro,countEnabled,loop,clipSnap,followCursor,device:preferredDevice}))}catch(e){msg('設定を保存できません：'+e.message)}}
function restorePreferences(){try{const p=JSON.parse(localStorage.getItem(prefKey)||'null');if(!p)return;for(const id of prefInputs){if(p.inputs?.[id]!=null){$(id).value=p.inputs[id];if(id==='bpm'||id==='bars')$(id).onchange();else if($(id).oninput)$(id).oninput()}}metro=typeof p.metro==='boolean'?p.metro:metro;countEnabled=typeof p.countEnabled==='boolean'?p.countEnabled:countEnabled;loop=typeof p.loop==='boolean'?p.loop:loop;if(typeof p.clipSnap==='boolean'&&p.clipSnap!==clipSnap)$('clipsnap').onclick();if(typeof p.followCursor==='boolean'&&p.followCursor!==followCursor)$('follow').onclick();preferredDevice=typeof p.device==='string'?p.device:'';buttons();draw()}catch(e){msg('設定復元エラー：'+e.message)}}
restorePreferences();
// Ctrl＋ホイールはブラウザの拡大縮小ではなく、DAWの横ズームに割り当てる。
window.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  if(!e.deltaY)return;
  const z=$('zoom'), direction=e.deltaY<0?1:-1;
  const current=+z.value;
  const next=clamp(current+direction*Math.max(1,Math.round(current*.12)),+z.min,+z.max);
  if(next===current)return;
  z.value=String(next);
  z.dispatchEvent(new Event('input',{bubbles:true}));
},{capture:true,passive:false});

for(const id of prefInputs){$(id).addEventListener('change',savePreferences);if($(id).type==='range')$(id).addEventListener('input',savePreferences)}
for(const id of ['metro','countin','loop','clipsnap','follow'])$(id).addEventListener('click',savePreferences);
$('device').addEventListener('change',()=>{preferredDevice=$('device').value;savePreferences()});
// 起動時に保存済みの音源を復元。手動読込との競合を避ける。
(async()=>{const btn=$('sfload');btn.disabled=true;try{const item=await sfStore('get');if(item?.blob)await loadSF(new File([item.blob],item.name||'SoundFont.sf2'),true)}catch(e){msg('保存済み音源の復元に失敗：'+e.message)}finally{btn.disabled=false}})();

})();
